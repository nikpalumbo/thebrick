name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sync property data from CRM source
        env:
          CRM_FEED_URL: ${{ secrets.CRM_FEED_URL }}
          CRM_FEED_TOKEN: ${{ secrets.CRM_FEED_TOKEN }}
        run: python3 scripts/sync_crm.py

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html about.html team.html contact.html robots.txt CNAME site/
          cp -R assets css js data properties off-market site/
          if [ -n "$OFF_MARKET_ACCESS_HASH" ]; then
            python3 -c "
          import json, os
          path = 'site/data/off-market-config.json'
          with open(path) as f: cfg = json.load(f)
          cfg['accessHash'] = os.environ['OFF_MARKET_ACCESS_HASH']
          with open(path, 'w') as f: json.dump(cfg, f, indent=2)
          "
          fi
          if [ -n "$LEAD_WEBHOOK_URL" ]; then
            python3 -c "
          import json, os
          path = 'site/data/off-market-config.json'
          with open(path) as f: cfg = json.load(f)
          cfg['leadWebhookUrl'] = os.environ['LEAD_WEBHOOK_URL']
          with open(path, 'w') as f: json.dump(cfg, f, indent=2)
          "
          fi
          if [ -n "$LEAD_FORMSPREE_ID" ]; then
            python3 -c "
          import json, os
          path = 'site/data/off-market-config.json'
          with open(path) as f: cfg = json.load(f)
          cfg['formspreeFormId'] = os.environ['LEAD_FORMSPREE_ID']
          with open(path, 'w') as f: json.dump(cfg, f, indent=2)
          "
          fi
        env:
          OFF_MARKET_ACCESS_HASH: ${{ secrets.OFF_MARKET_ACCESS_HASH }}
          LEAD_WEBHOOK_URL: ${{ secrets.LEAD_WEBHOOK_URL }}
          LEAD_FORMSPREE_ID: ${{ secrets.LEAD_FORMSPREE_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
