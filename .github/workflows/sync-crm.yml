name: Sync CRM properties

on:
  workflow_dispatch:
  repository_dispatch:
    types: [crm-updated]

# Scheduled sync disabled while using static fake CRM (data/crm-source.json).
# Re-enable when CRM_FEED_URL is configured:
# schedule:
#   - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync from CRM feed
        env:
          CRM_FEED_URL: ${{ secrets.CRM_FEED_URL }}
          CRM_FEED_TOKEN: ${{ secrets.CRM_FEED_TOKEN }}
        run: python3 scripts/sync_crm.py

      - name: Commit updated property data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/data/properties.json preview/data/off-market.json preview/data/sold.json preview/data/sync-meta.json
          if git diff --staged --quiet; then
            echo "No property changes to commit."
          else
            git commit -m "chore: sync properties from CRM"
            git push
          fi
