<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Brick — Proposal A · LuxuryEstate style</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #b8956a;
      --gold-bright: #d4b07a;
      --ink: #111111;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Manrope', sans-serif;
      background: #000;
      color: var(--white);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .slides {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.1s ease;
    }
    .slide.is-active { opacity: 1; }
    .slide-1 { background-image: url('../assets/villa-pool.jpg'); }
    .slide-2 { background-image: url('../assets/villa-modern.jpg'); }
    .slide-3 { background-image: url('../assets/villa-night.jpg'); }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.18) 35%, rgba(0,0,0,0.25) 60%, rgba(0,0,0,0.62) 100%);
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem clamp(1rem, 3vw, 2.5rem);
      animation: fade 0.8s ease both;
    }

    .logo-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--white);
      padding: 0.45rem 1rem 0.45rem 0.55rem;
      border: 1px solid rgba(184,149,106,0.65);
      background: rgba(0,0,0,0.55);
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }
    .logo-pill img {
      width: 36px;
      height: auto;
      display: block;
    }
    .logo-pill span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-bright);
      font-weight: 500;
    }

    .nav {
      display: none;
      align-items: center;
      gap: 1.5rem;
      list-style: none;
    }
    @media (min-width: 860px) { .nav { display: flex; } }
    .nav a, .nav button {
      background: none;
      border: 0;
      color: rgba(255,255,255,0.92);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 400;
      cursor: pointer;
      text-decoration: none;
    }
    .nav a:hover, .nav button:hover { color: var(--gold-bright); }
    .nav .sell {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .nav .login {
      border: 1px solid rgba(184,149,106,0.55);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      color: var(--gold-bright);
    }

    .center {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem 1.25rem 2rem;
      animation: rise 1s 0.1s ease both;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(2rem, 5.2vw, 3.4rem);
      line-height: 1.15;
      max-width: 18ch;
      margin-bottom: 1.75rem;
      text-shadow: 0 2px 30px rgba(0,0,0,0.35);
    }
    h1 .gold {
      color: var(--gold-bright);
    }

    .search {
      display: flex;
      flex-direction: column;
      width: min(100%, 52rem);
      background: var(--white);
      border-radius: 999px;
      padding: 0.4rem;
      box-shadow: 0 18px 50px rgba(0,0,0,0.28);
      border: 1px solid rgba(184,149,106,0.35);
    }
    @media (min-width: 720px) {
      .search {
        flex-direction: row;
        align-items: stretch;
      }
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.65rem 1.15rem;
      text-align: left;
      border: 0;
      background: transparent;
      min-width: 0;
      position: relative;
    }
    @media (min-width: 720px) {
      .field:not(:last-of-type)::after {
        content: '';
        position: absolute;
        right: 0;
        top: 22%;
        bottom: 22%;
        width: 1px;
        background: #e8e2d8;
      }
    }
    .field label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 0.15rem;
    }
    .field select,
    .field input {
      border: 0;
      outline: none;
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: transparent;
      width: 100%;
      appearance: none;
      cursor: pointer;
    }
    .field input { cursor: text; }
    .field input::placeholder { color: #9a948c; }

    .search-btn {
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #c4a574, #9a7b4e);
      color: var(--white);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.95rem 1.6rem;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 0.2s, transform 0.2s;
    }
    .search-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .bottom {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 clamp(1rem, 3vw, 2.5rem) 1.75rem;
      animation: fade 1s 0.2s ease both;
    }
    .caption {
      max-width: 28rem;
    }
    .caption a {
      color: var(--white);
      text-decoration: none;
    }
    .caption h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 2.5vw, 1.65rem);
      font-weight: 500;
      margin-bottom: 0.35rem;
    }
    .caption p {
      font-size: 0.85rem;
      font-weight: 300;
      color: rgba(255,255,255,0.82);
      line-height: 1.45;
    }
    .dots {
      display: flex;
      gap: 0.45rem;
      margin-top: 0.9rem;
    }
    .dots button {
      width: 1.6rem;
      height: 2px;
      border: 0;
      background: rgba(255,255,255,0.35);
      cursor: pointer;
      padding: 0;
    }
    .dots button.is-active { background: var(--gold-bright); }

    .arrow {
      position: absolute;
      top: 50%;
      z-index: 6;
      transform: translateY(-50%);
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.25);
      color: var(--white);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      backdrop-filter: blur(4px);
    }
    .arrow:hover {
      border-color: var(--gold);
      color: var(--gold-bright);
    }
    .arrow.prev { left: 1rem; }
    .arrow.next { right: 1rem; }
    @media (max-width: 700px) {
      .arrow { display: none; }
    }

    .proposal-tag {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 30;
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.55rem 0.85rem;
      text-decoration: none;
    }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="slides" aria-hidden="true">
      <div class="slide slide-1 is-active"></div>
      <div class="slide slide-2"></div>
      <div class="slide slide-3"></div>
    </div>
    <div class="veil"></div>

    <header class="top">
      <a class="logo-pill" href="../">
        <img src="../assets/logo-transparent.png" alt="">
        <span>The Brick</span>
      </a>
      <nav>
        <ul class="nav">
          <li><a href="#">Value your home</a></li>
          <li><button class="sell" type="button">Sell with us ▾</button></li>
          <li><a href="#">EN · CHF</a></li>
          <li><a class="login" href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <button class="arrow prev" type="button" aria-label="Previous">‹</button>
    <button class="arrow next" type="button" aria-label="Next">›</button>

    <div class="center">
      <h1>Explore the most prestigious luxury residences in <span class="gold">Ticino</span></h1>
      <form class="search" action="#" onsubmit="return false;">
        <div class="field">
          <label for="contract">Contract</label>
          <select id="contract">
            <option>For sale</option>
            <option>For rent</option>
            <option>Off-Market</option>
          </select>
        </div>
        <div class="field">
          <label for="price">Price</label>
          <select id="price">
            <option>Any price</option>
            <option>Up to CHF 2M</option>
            <option>CHF 2–5M</option>
            <option>CHF 5–10M</option>
            <option>CHF 10M+</option>
          </select>
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input id="location" type="search" placeholder="Lugano, lake, villa…">
        </div>
        <button class="search-btn" type="submit">Search</button>
      </form>
    </div>

    <div class="bottom">
      <div class="caption">
        <a href="#">
          <h2>Villa for sale on Lake Lugano</h2>
          <p>A discreet lakeside residence with panoramic terrace and private garden — curated by The Brick.</p>
        </a>
        <div class="dots" role="tablist" aria-label="Featured residences">
          <button type="button" class="is-active" aria-label="1"></button>
          <button type="button" aria-label="2"></button>
          <button type="button" aria-label="3"></button>
        </div>
      </div>
    </div>
  </section>

  <a class="proposal-tag" href="../">← All proposals</a>

  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const dots = [...document.querySelectorAll('.dots button')];
    let i = 0;
    function go(n) {
      slides[i].classList.remove('is-active');
      dots[i].classList.remove('is-active');
      i = (n + slides.length) % slides.length;
      slides[i].classList.add('is-active');
      dots[i].classList.add('is-active');
    }
    document.querySelector('.arrow.prev').onclick = () => go(i - 1);
    document.querySelector('.arrow.next').onclick = () => go(i + 1);
    dots.forEach((d, idx) => d.onclick = () => go(idx));
    setInterval(() => go(i + 1), 7000);
  </script>
</body>
</html>
