<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Brick — Proposal A · LuxuryEstate style</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c6a46a;
      --gold-bright: #e0c49a;
      --gold-deep: #9a7b4e;
      --ink: #111111;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Manrope', sans-serif;
      background: #000;
      color: var(--white);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .slides { position: absolute; inset: 0; z-index: 0; }
    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.1s ease;
    }
    .slide.is-active { opacity: 1; }
    .slide-1 { background-image: url('../assets/villa-pool.jpg'); }
    .slide-2 { background-image: url('../assets/villa-modern.jpg'); }
    .slide-3 { background-image: url('../assets/villa-night.jpg'); }

    /* Stronger veil for readable white UI */
    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg,
          rgba(0,0,0,0.72) 0%,
          rgba(0,0,0,0.42) 28%,
          rgba(0,0,0,0.28) 50%,
          rgba(0,0,0,0.55) 78%,
          rgba(0,0,0,0.78) 100%);
    }

    .top {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      padding: 1.25rem clamp(1.1rem, 3vw, 2.75rem);
    }

    /* Official logo from EPS — transparent PNG */
    .brand {
      display: block;
      text-decoration: none;
      line-height: 0;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
    }
    .brand img {
      width: auto;
      height: 100px;
      display: block;
    }
    @media (min-width: 900px) {
      .brand img { height: 120px; }
    }

    .nav {
      display: none;
      align-items: center;
      gap: 1.75rem;
      list-style: none;
    }
    @media (min-width: 900px) { .nav { display: flex; } }
    .nav a, .nav button {
      background: none;
      border: 0;
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
      white-space: nowrap;
    }
    .nav a:hover, .nav button:hover { color: var(--gold-bright); }
    .nav .login {
      border: 1.5px solid var(--gold);
      padding: 0.6rem 1.15rem;
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,0.35);
    }
    .nav .login:hover {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
    }

    .center {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.25rem 1.25rem 2.25rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2.6rem, 6vw, 4.25rem);
      line-height: 1.12;
      max-width: 16ch;
      margin-bottom: 2rem;
      color: #fff;
      text-shadow: 0 3px 28px rgba(0,0,0,0.55);
    }
    h1 .gold { color: var(--gold-bright); }

    .search {
      display: flex;
      flex-direction: column;
      width: min(100%, 56rem);
      background: #fff;
      border-radius: 999px;
      padding: 0.45rem;
      box-shadow: 0 22px 55px rgba(0,0,0,0.4);
      border: 1px solid rgba(198,164,106,0.55);
    }
    @media (min-width: 760px) {
      .search { flex-direction: row; align-items: stretch; }
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.85rem 1.35rem;
      text-align: left;
      min-width: 0;
      position: relative;
    }
    @media (min-width: 760px) {
      .field:not(:last-of-type)::after {
        content: '';
        position: absolute;
        right: 0;
        top: 20%;
        bottom: 20%;
        width: 1px;
        background: #e5ddd0;
      }
    }
    .field label {
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-deep);
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .field select,
    .field input {
      border: 0;
      outline: none;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ink);
      background: transparent;
      width: 100%;
      appearance: none;
    }
    .field input::placeholder { color: #8a847c; font-weight: 400; }

    .search-btn {
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #d4b896, #9a7b4e);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 1.1rem 1.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .search-btn:hover { filter: brightness(1.08); }

    .bottom {
      position: relative;
      z-index: 5;
      padding: 0 clamp(1.1rem, 3vw, 2.75rem) 2rem;
    }
    .caption { max-width: 34rem; }
    .caption a { color: #fff; text-decoration: none; }
    .caption h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.55rem, 3vw, 2.1rem);
      font-weight: 600;
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 16px rgba(0,0,0,0.55);
    }
    .caption p {
      font-size: 1.05rem;
      font-weight: 500;
      color: rgba(255,255,255,0.92);
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    .dots {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .dots button {
      width: 2rem;
      height: 3px;
      border: 0;
      background: rgba(255,255,255,0.35);
      cursor: pointer;
      padding: 0;
    }
    .dots button.is-active { background: var(--gold-bright); }

    .arrow {
      position: absolute;
      top: 50%;
      z-index: 6;
      transform: translateY(-50%);
      width: 2.75rem;
      height: 2.75rem;
      border: 1.5px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.45);
      color: #fff;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.35rem;
      line-height: 1;
    }
    .arrow:hover {
      border-color: var(--gold-bright);
      color: var(--gold-bright);
    }
    .arrow.prev { left: 1.1rem; }
    .arrow.next { right: 1.1rem; }
    @media (max-width: 700px) { .arrow { display: none; } }

    .proposal-tag {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 30;
      background: rgba(0,0,0,0.9);
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.6rem 0.9rem;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="slides" aria-hidden="true">
      <div class="slide slide-1 is-active"></div>
      <div class="slide slide-2"></div>
      <div class="slide slide-3"></div>
    </div>
    <div class="veil"></div>

    <header class="top">
      <a class="brand" href="../">
        <img src="../assets/logo-transparent.png?v=eps1" width="1316" height="1813" alt="The Brick Luxury Properties">
      </a>
      <nav>
        <ul class="nav">
          <li><a href="#">Value your home</a></li>
          <li><button type="button">Sell with us ▾</button></li>
          <li><a href="#">EN · CHF</a></li>
          <li><a class="login" href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <button class="arrow prev" type="button" aria-label="Previous">‹</button>
    <button class="arrow next" type="button" aria-label="Next">›</button>

    <div class="center">
      <h1>Explore the most prestigious luxury residences in <span class="gold">Ticino</span></h1>
      <form class="search" action="#" onsubmit="return false;">
        <div class="field">
          <label for="contract">Contract</label>
          <select id="contract">
            <option>For sale</option>
            <option>For rent</option>
            <option>Off-Market</option>
          </select>
        </div>
        <div class="field">
          <label for="price">Price</label>
          <select id="price">
            <option>Any price</option>
            <option>Up to CHF 2M</option>
            <option>CHF 2–5M</option>
            <option>CHF 5–10M</option>
            <option>CHF 10M+</option>
          </select>
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input id="location" type="search" placeholder="Lugano, lake, villa…">
        </div>
        <button class="search-btn" type="submit">Search</button>
      </form>
    </div>

    <div class="bottom">
      <div class="caption">
        <a href="#">
          <h2>Villa for sale on Lake Lugano</h2>
          <p>A discreet lakeside residence with panoramic terrace and private garden — curated by The Brick.</p>
        </a>
        <div class="dots" role="tablist" aria-label="Featured residences">
          <button type="button" class="is-active" aria-label="1"></button>
          <button type="button" aria-label="2"></button>
          <button type="button" aria-label="3"></button>
        </div>
      </div>
    </div>
  </section>

  <a class="proposal-tag" href="../">← All proposals</a>

  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const dots = [...document.querySelectorAll('.dots button')];
    let i = 0;
    function go(n) {
      slides[i].classList.remove('is-active');
      dots[i].classList.remove('is-active');
      i = (n + slides.length) % slides.length;
      slides[i].classList.add('is-active');
      dots[i].classList.add('is-active');
    }
    document.querySelector('.arrow.prev').onclick = () => go(i - 1);
    document.querySelector('.arrow.next').onclick = () => go(i + 1);
    dots.forEach((d, idx) => d.onclick = () => go(idx));
    setInterval(() => go(i + 1), 7000);
  </script>
</body>
</html>
